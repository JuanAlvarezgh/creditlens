[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
# `airflow/` is the directory holding our DAGs but `airflow` is also the
# third-party Apache Airflow package — declare it explicitly so isort does
# not split `from airflow import DAG` from `from airflow.operators...`.
known_third_party = ["airflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # let black handle line length

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
